name: Release

# Tag-driven release. Pushing an annotated tag matching `v*` runs this
# workflow, which downloads the six prebuilds from the matching CI run and
# publishes `libghostty-vt` to npm via OIDC trusted publishing — no
# long-lived `NPM_TOKEN` exists or is needed.
#
# The `npm-publish` GitHub Environment gates the publish step behind a
# required reviewer. Trusted publisher must be configured on npmjs.com
# under primeradianthq for this to work; see CLAUDE.md.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: macos-14
    environment: npm-publish

    permissions:
      # OIDC token minting for npm trusted publishing.
      id-token: write
      # `gh run list` / `gh run download` need read access to the repo.
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        working-directory: packages/libghostty-vt
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "tag:     v$TAG_VERSION"
          echo "package: $PKG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: bun install
        run: bun install --frozen-lockfile

      # Build the TS dist locally (no native rebuild needed; CI already
      # produced all prebuilds, which we pull below).
      - name: Build TypeScript
        working-directory: packages/libghostty-vt
        run: bun run build:ts

      # Find the CI run for this commit and download its prebuild artifacts.
      # The tag points at a commit that should already have a green CI run;
      # we look it up via the gh CLI rather than via download-artifact's
      # cross-workflow path (which doesn't work on push:tags triggers).
      - name: Download prebuilds from CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/libghostty-vt
        run: |
          set -e
          mkdir -p prebuilds
          SHA="${{ github.sha }}"
          echo "Looking for successful CI run on commit $SHA"
          # `gh run list --status=...` is broken in this CLI version: both
          # `--status=success` (matches conclusion) and `--status=completed`
          # (matches status field) silently return [] even when a matching
          # run exists. Drop the flag entirely and jq-filter both fields.
          RUN_ID=$(gh run list \
            --workflow=ci.yml \
            --commit="$SHA" \
            --limit=10 \
            --json databaseId,status,conclusion \
            --jq 'map(select(.status == "completed" and .conclusion == "success")) | .[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: No successful CI run found for commit $SHA" >&2
            echo "Either CI hasn't completed yet, or it failed." >&2
            exit 1
          fi
          echo "Using CI run $RUN_ID"
          for plat in darwin-arm64 linux-x64 linux-arm64; do
            gh run download "$RUN_ID" -n "prebuilds-$plat" -D prebuilds/staging-$plat/
            # The CI artifact contains a prebuilds/ directory at its root;
            # flatten it into our local prebuilds/.
            cp -r prebuilds/staging-$plat/* prebuilds/
            rm -rf prebuilds/staging-$plat
          done

      - name: Verify all six prebuilds present
        working-directory: packages/libghostty-vt
        run: |
          set -e
          for plat in darwin-arm64 linux-x64-glibc linux-x64-musl linux-arm64-glibc linux-arm64-musl; do
            ext=so
            [ "$plat" = "darwin-arm64" ] && ext=dylib
            test -f "prebuilds/$plat/libghostty-vt.$ext" || { echo "missing $plat lib"; exit 1; }
            test -f "prebuilds/$plat/libghostty-vt-shim.$ext" || { echo "missing $plat shim"; exit 1; }
          done
          echo "all six prebuilds present"

      - name: Tarball smoke
        working-directory: packages/libghostty-vt
        run: bash scripts/run-tarball-smoke.sh

      - name: Publish libghostty-vt via OIDC
        working-directory: packages/libghostty-vt
        # Use `npx -y npm@latest` rather than the macos-14 runner's
        # pre-installed npm 10.9.x: trusted publishing requires npm
        # >= 11.5.1. Bun (1.3.13) doesn't auto-detect the GitHub
        # Actions OIDC env vars at publish time; npm 11+ does.
        # `npm install -g npm@latest` hits a known self-update bug
        # mid-upgrade ("Cannot find module 'promise-retry'"), so npx
        # is the reliable path.
        #
        # No NODE_AUTH_TOKEN needed: with `permissions.id-token: write`,
        # npm exchanges the GitHub OIDC token for a short-lived npm
        # token automatically. `--provenance` records a SLSA attestation.
        run: npx -y npm@latest publish --provenance --access public

      # ---------- blinkyterm ----------
      # blinkyterm depends on libghostty-vt via `workspace:*`. `npm publish`
      # would publish a tarball with that literal specifier, which is
      # uninstallable. So we pre-pack with `bun pm pack` (which resolves
      # workspace:* to the locally-linked version), then `npm publish` the
      # resulting tarball with OIDC + provenance. Order matters: this runs
      # AFTER libghostty-vt is published so the resolved version exists on
      # the registry by the time consumers install blinkyterm.

      - name: Build blinkyterm TypeScript
        working-directory: packages/blinkyterm
        run: bun run build

      - name: Pack blinkyterm (resolves workspace:* deps)
        working-directory: packages/blinkyterm
        id: pack-blinkyterm
        run: |
          mkdir -p .tmp
          bun pm pack --destination .tmp
          TARBALL=$(ls -1t .tmp/*.tgz | head -n 1)
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "::error::bun pm pack did not produce a tarball"
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed: $TARBALL"
          # Sanity-check: the tarball should NOT contain "workspace:*".
          # If it does, something went wrong with bun's resolution.
          tar -xzf "$TARBALL" -O package/package.json | grep -q '"workspace:' && {
            echo "::error::tarball still contains workspace: protocol; bun pm pack did not resolve it"
            exit 1
          } || true

      - name: Publish blinkyterm via OIDC
        working-directory: packages/blinkyterm
        run: npx -y npm@latest publish --provenance --access public "${{ steps.pack-blinkyterm.outputs.tarball }}"
