name: Release

# Tag-driven release. Pushing an annotated tag matching `v*` runs this
# workflow, which downloads the six prebuilds from the matching CI run and
# publishes `libghostty-vt` to npm via OIDC trusted publishing — no
# long-lived `NPM_TOKEN` exists or is needed.
#
# The `npm-publish` GitHub Environment gates the publish step behind a
# required reviewer. Trusted publisher must be configured on npmjs.com
# under primeradianthq for this to work; see CLAUDE.md.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: macos-14
    environment: npm-publish

    permissions:
      # OIDC token minting for npm trusted publishing.
      id-token: write
      # `gh run list` / `gh run download` need read access to the repo.
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        working-directory: packages/libghostty-vt
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "tag:     v$TAG_VERSION"
          echo "package: $PKG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: bun install
        run: bun install --frozen-lockfile

      # Build the TS dist locally (no native rebuild needed; CI already
      # produced all prebuilds, which we pull below).
      - name: Build TypeScript
        working-directory: packages/libghostty-vt
        run: bun run build:ts

      # Find the CI run for this commit and download its prebuild artifacts.
      # The tag points at a commit that should already have a green CI run;
      # we look it up via the gh CLI rather than via download-artifact's
      # cross-workflow path (which doesn't work on push:tags triggers).
      - name: Download prebuilds from CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/libghostty-vt
        run: |
          set -e
          mkdir -p prebuilds
          SHA="${{ github.sha }}"
          echo "Looking for successful CI run on commit $SHA"
          # `--status` matches gh's `status` field (queued|in_progress|completed),
          # not `conclusion`. Filter on conclusion via jq so we get a real
          # green run, not just any completed run.
          RUN_ID=$(gh run list \
            --workflow=ci.yml \
            --commit="$SHA" \
            --status=completed \
            --limit=10 \
            --json databaseId,conclusion \
            --jq 'map(select(.conclusion == "success")) | .[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: No successful CI run found for commit $SHA" >&2
            echo "Either CI hasn't completed yet, or it failed." >&2
            exit 1
          fi
          echo "Using CI run $RUN_ID"
          for plat in darwin-arm64 linux-x64 linux-arm64; do
            gh run download "$RUN_ID" -n "prebuilds-$plat" -D prebuilds/staging-$plat/
            # The CI artifact contains a prebuilds/ directory at its root;
            # flatten it into our local prebuilds/.
            cp -r prebuilds/staging-$plat/* prebuilds/
            rm -rf prebuilds/staging-$plat
          done

      - name: Verify all six prebuilds present
        working-directory: packages/libghostty-vt
        run: |
          set -e
          for plat in darwin-arm64 linux-x64-glibc linux-x64-musl linux-arm64-glibc linux-arm64-musl; do
            ext=so
            [ "$plat" = "darwin-arm64" ] && ext=dylib
            test -f "prebuilds/$plat/libghostty-vt.$ext" || { echo "missing $plat lib"; exit 1; }
            test -f "prebuilds/$plat/libghostty-vt-shim.$ext" || { echo "missing $plat shim"; exit 1; }
          done
          echo "all six prebuilds present"

      - name: Tarball smoke
        working-directory: packages/libghostty-vt
        run: bash scripts/run-tarball-smoke.sh

      - uses: actions/setup-node@v4
        with:
          # Node 22's bundled npm (>= 11.5.1) supports OIDC trusted publishing.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm version supports trusted publishing
        run: |
          npm --version
          node -e "const v = require('child_process').execSync('npm --version').toString().trim(); const [maj, min, pat] = v.split('.').map(Number); if (maj < 11 || (maj === 11 && min < 5) || (maj === 11 && min === 5 && pat < 1)) { console.error('npm', v, '< 11.5.1, no trusted publishing'); process.exit(1); }"

      - name: Publish to npm via OIDC
        working-directory: packages/libghostty-vt
        # No NODE_AUTH_TOKEN: trusted publishing exchanges the GitHub OIDC
        # token (minted because of `permissions.id-token: write`) for a
        # short-lived npm token automatically. `--provenance` records a
        # SLSA attestation linking this build to the workflow run.
        run: npm publish --provenance --access public
