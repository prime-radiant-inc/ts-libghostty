name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # macos-14 is Apple Silicon (arm64). `macos-latest` at GitHub Actions
    # currently resolves to macos-14 too, but we pin explicitly so that a
    # future remapping does not silently switch us to an unsupported arch.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner is arm64
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          # Zig 0.15.2 is required by Ghostty 1.3.x (per build.zig.zon
          # minimum_zig_version). Stock ziglang.org 0.15.2 links cleanly on
          # macOS 14; the Tahoe/macOS 26 libSystem ABI break that forces local
          # dev to use brew's patched zig@0.15 does not affect 14. If a future
          # Ghostty pin requires a different zig minor, bump this alongside
          # package.json ghostty.commit.
          version: "0.15.2"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Exact version, not a range — some setup-bun versions reject ranges.
          bun-version: "1.3.13"

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Build libghostty
        run: bun run build:libghostty

      - name: Build probe and regenerate bindings
        run: bun run build:probe && bun run build:bindings

      - name: Verify generated.ts is up to date
        run: git diff --exit-code src/internal/generated.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Unit + smoke tests
        run: bun run test:smoke

      - name: Build TypeScript
        run: bun run build:ts

      - name: Tarball smoke
        run: bun run test:tarball
